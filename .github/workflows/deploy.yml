name: Deploy site

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm install
    - run: npm run build
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/dist

  whitepaper:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install TeX Live
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-latex-base texlive-latex-recommended texlive-latex-extra \
          texlive-fonts-recommended texlive-fonts-extra \
          texlive-bibtex-extra biber
    - name: Build whitepaper PDF
      working-directory: whitepaper
      run: make
    - name: Name the PDF
      id: pdf
      run: |
        name="Binius64 Blueprint $(date +%F).pdf"
        mv whitepaper/main.pdf "whitepaper/$name"
        echo "name=$name" >> "$GITHUB_OUTPUT"
    - name: Upload whitepaper artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.pdf.outputs.name }}
        path: whitepaper/${{ steps.pdf.outputs.name }}

  deploy:
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

