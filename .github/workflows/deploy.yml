name: Deploy site

on:
  push:
    branches: ["main"]

jobs:
  whitepaper:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Cache whitepaper PDF
      id: cache
      uses: actions/cache@v4
      with:
        path: whitepaper/main.pdf
        # Only the contents of whitepaper/ affect the PDF, so reuse a cached
        # build whenever nothing there has changed.
        key: whitepaper-pdf-${{ hashFiles('whitepaper/**') }}
    - name: Install TeX Live
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          texlive-latex-base texlive-latex-recommended texlive-latex-extra \
          texlive-fonts-recommended texlive-fonts-extra \
          texlive-bibtex-extra biber
    - name: Build whitepaper PDF
      if: steps.cache.outputs.cache-hit != 'true'
      working-directory: whitepaper
      run: make
    - name: Upload whitepaper PDF for site build
      uses: actions/upload-artifact@v4
      with:
        name: whitepaper-pdf
        path: whitepaper/main.pdf
    - name: Name the dated PDF
      id: pdf
      run: |
        name="Binius64 Blueprint $(date +%F).pdf"
        cp whitepaper/main.pdf "whitepaper/$name"
        echo "name=$name" >> "$GITHUB_OUTPUT"
    - name: Upload dated whitepaper artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.pdf.outputs.name }}
        path: whitepaper/${{ steps.pdf.outputs.name }}

  build:
    needs: whitepaper
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'npm'
    - name: Download whitepaper PDF
      uses: actions/download-artifact@v4
      with:
        name: whitepaper-pdf
        path: whitepaper
    - run: npm install
    - name: Copy whitepaper into site assets
      run: cp whitepaper/main.pdf docs/public/spec.pdf
    - run: npm run build:site
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/dist

  deploy:
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
